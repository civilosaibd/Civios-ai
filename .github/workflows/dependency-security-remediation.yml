name: Dependency Security Remediation

on:
  push:
    branches:
      - security/dependency-remediation-2026-10-25
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-security-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Safe public test values only; never use production secrets in CI.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation-2026-10-25
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply compatible security fixes (no force)
        id: auditfix
        continue-on-error: true
        run: npm audit fix

      - name: Capture complete post-fix audit report
        id: audit
        if: always()
        continue-on-error: true
        run: |
          npm audit --json > dependency-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          let audit = {};
          try { audit = JSON.parse(fs.readFileSync('dependency-audit.json', 'utf8')); }
          catch (e) { console.error('Could not parse npm audit output:', e.message); process.exit(1); }
          const meta = audit.metadata?.vulnerabilities || {};
          const findings = Object.entries(audit.vulnerabilities || {}).map(([name, v]) => ({
            name, severity: v.severity, range: v.range, isDirect: v.isDirect,
            fixAvailable: v.fixAvailable, via: (v.via || []).map(x => typeof x === 'string' ? x : x.name)
          }));
          const report = { generatedAt: new Date().toISOString(), counts: meta, findings };
          fs.writeFileSync('dependency-audit-summary.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: |
            dependency-audit.json
            dependency-audit-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: npm test -- --run

      - name: Run production build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Commit compatible dependency changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: remediate npm dependency vulnerabilities"
            git push origin HEAD:security/dependency-remediation-2026-10-25
          fi

      - name: Publish workflow summary
        if: always()
        env:
          AUDIT_FIX_OUTCOME: ${{ steps.auditfix.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "## Dependency security remediation"
            echo ""
            echo "- npm audit fix (without force): ${AUDIT_FIX_OUTCOME:-not run}"
            echo "- Unit tests: ${TEST_OUTCOME:-not run}"
            echo "- Production build: ${BUILD_OUTCOME:-not run}"
            echo "- Full audit evidence: see the dependency-security-audit workflow artifact."
            echo ""
            echo "A successful workflow is not a guarantee of zero vulnerabilities; inspect the audit counts and all unresolved findings."
          } >> "$GITHUB_STEP_SUMMARY"
