name: CivilOS AI quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        # Inert values let tests import the browser client without using project secrets.
        # The test suite does not make network requests to this placeholder project.
        env:
          VITE_SUPABASE_URL: https://unit-test.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: unit-test-publishable-key
          VITE_SUPABASE_PROJECT_ID: unit-test
        run: npm test

      - name: Install ephemeral Postgres migration-test dependency
        run: npm install --no-save --no-audit --no-fund @electric-sql/pglite

      - name: Test Supabase migrations and referral/payment security
        run: node --test supabase/tests/security.test.mjs supabase/tests/affiliate.test.mjs supabase/tests/admin-rbac.test.mjs

      - name: Build production bundle
        # Build with isolated placeholder config; never embed a production project in CI.
        env:
          VITE_SUPABASE_URL: https://unit-test.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: unit-test-publishable-key
          VITE_SUPABASE_PROJECT_ID: unit-test
        run: npm run build
