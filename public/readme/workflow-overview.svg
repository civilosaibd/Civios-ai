<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">CivilOS AI engineering workflow overview</title>
<desc id="desc">An illustrative workflow connecting architectural drawings, a three-dimensional building model, engineering quantities and BOQ, and an AI engineering assistant. This is a conceptual illustration, not a screenshot of the application.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152e"/><stop offset="1" stop-color="#102d55"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f97316"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020817" flood-opacity=".35"/></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#7dd3fc" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1440" height="720" rx="34" fill="url(#bg)"/><rect width="1440" height="720" rx="34" fill="url(#grid)"/>
